name: Build APK (Mega Auto-Fix v5.0)

on:
  push:
    branches:
      - build
    paths:
      - 'project.zip'
      - 'build-config.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
  JAVA_TOOL_OPTIONS: "-Xmx4096m"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.cfg.outputs.build_type }}
      project_type: ${{ steps.cfg.outputs.project_type }}
      flutter_version: ${{ steps.detect.outputs.flutter_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Config
        id: cfg
        run: |
          BT="release"
          PT="flutter"
          if [ -f build-config.json ]; then
            BT=$(jq -r .build_type build-config.json)
            PT=$(jq -r .type build-config.json)
          fi
          echo "build_type=$BT" >> $GITHUB_OUTPUT
          echo "project_type=$PT" >> $GITHUB_OUTPUT
          echo "Type: $PT | Mode: $BT"

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unzip bsdtar python3 jq 2>/dev/null || \
          sudo apt-get install -y -qq p7zip-full unzip python3 jq

      - name: Detect Flutter Version
        id: detect
        run: |
          rm -rf /tmp/fc
          mkdir -p /tmp/fc
          7z x project.zip -o/tmp/fc -y > /dev/null 2>&1 || unzip -o -q project.zip -d /tmp/fc 2>/dev/null || true
          PUB=$(find /tmp/fc -maxdepth 4 -name pubspec.yaml -not -path '*/.*' | head -n1)
          if [ -z "$PUB" ]; then
            echo "flutter_version=3.35.2" >> $GITHUB_OUTPUT
            exit 0
          fi
          SDK=$(grep -A3 '^environment:' "$PUB" | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["'"'"']//g' || echo "")
          DART=$(echo "$SDK" | grep -oE '[0-9]+\.[0-9]+' | head -n1 || echo "")
          FV="3.35.2"
          case "$DART" in
            "3.8") FV="3.32.0" ;;
            "3.7") FV="3.29.0" ;;
            "3.6") FV="3.27.0" ;;
            "3.5") FV="3.24.0" ;;
            "3.4") FV="3.22.0" ;;
          esac
          echo "flutter_version=$FV" >> $GITHUB_OUTPUT
          echo "Flutter: $FV"

  build:
    name: Build APK
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          for pkg in "platforms;android-33" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;33.0.2" "build-tools;34.0.0" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools" "cmdline-tools;latest"; do
            sdkmanager "$pkg" > /dev/null 2>&1 || true
          done

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick jq unzip curl file zip p7zip-full python3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.sha }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      # ====================================================================
      # 🔥 INIT.GRADLE — FORCE jvmTarget 17 DI SEMUA SUBPROJECT
      #    Ini fix utama untuk "Kotlin Compilation error"
      # ====================================================================
      - name: Create Gradle Init Script
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' \
            'allprojects {' \
            '    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {' \
            '        kotlinOptions {' \
            '            jvmTarget = "17"' \
            '            freeCompilerArgs += ["-Xjvm-default=all"]' \
            '            suppressWarnings = true' \
            '        }' \
            '    }' \
            '    afterEvaluate {' \
            '        if (plugins.hasPlugin("com.android.application") || plugins.hasPlugin("com.android.library")) {' \
            '            try {' \
            '                android {' \
            '                    compileOptions {' \
            '                        sourceCompatibility JavaVersion.VERSION_17' \
            '                        targetCompatibility JavaVersion.VERSION_17' \
            '                    }' \
            '                }' \
            '            } catch (Exception e) { }' \
            '        }' \
            '    }' \
            '}' \
            > ~/.gradle/init.gradle
          echo "=== init.gradle ==="
          cat ~/.gradle/init.gradle

      - name: Extract Project
        shell: bash
        run: |
          rm -rf project /tmp/ext
          mkdir -p project /tmp/ext

          echo "=== Extract pakai 7z (primary) ==="
          if 7z x project.zip -o/tmp/ext -y -bso0 -bsp0 2>&1; then
            echo "OK 7z"
          elif bsdtar -xf project.zip -C /tmp/ext 2>&1; then
            echo "OK bsdtar"
          elif python3 -c "import zipfile; zipfile.ZipFile('project.zip').extractall('/tmp/ext')" 2>&1; then
            echo "OK python"
          else
            echo "Semua metode gagal, coba unzip"
            unzip -o -q project.zip -d /tmp/ext 2>&1 || true
          fi

          if [ "${{ needs.preflight.outputs.project_type }}" = "flutter" ]; then
            PUB=$(find /tmp/ext -maxdepth 4 -name pubspec.yaml -not -path '*/.*' | head -n1)
            if [ -z "$PUB" ]; then echo "pubspec.yaml tidak ditemukan"; ls -la /tmp/ext; exit 1; fi
            SRC=$(dirname "$PUB")
            cp -R "$SRC"/. project/ 2>/dev/null || rsync -a "$SRC"/ project/ 2>/dev/null || true
            echo "Flutter project ready"
          else
            GL=$(find /tmp/ext -maxdepth 4 -name gradlew -type f | head -n1)
            if [ -z "$GL" ]; then
              GL=$(find /tmp/ext -maxdepth 4 \( -name build.gradle -o -name build.gradle.kts \) | head -n1)
              [ -z "$GL" ] && { echo "build.gradle tidak ditemukan"; exit 1; }
              GL=$(dirname "$GL")
            else
              GL=$(dirname "$GL")
            fi
            cp -R "$GL"/. project/ 2>/dev/null || rsync -a "$GL"/ project/ 2>/dev/null || true
            echo "Gradle project ready"
          fi

          echo "Project size: $(du -sh project 2>/dev/null)"
          ls project/ | head -20

      - name: Setup Flutter ${{ needs.preflight.outputs.flutter_version }}
        if: needs.preflight.outputs.project_type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.preflight.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Show Flutter Version
        if: needs.preflight.outputs.project_type == 'flutter'
        run: flutter --version

      # ====================================================================
      # DEEP FIX — SCAN SEMUA build.gradle DAN PATCH
      # ====================================================================
      - name: Deep Fix All Gradle Files
        shell: bash
        run: |
          cd project
          echo "=== SCAN semua build.gradle ==="
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path "*/build/*" | while read f; do
            echo "--- Fix: $f ---"

            # ============ KOTLIN DSL ============
            perl -i -pe 's/\bcompileSdkVersion\s*=?\s*\d+/compileSdk = 36/g' "$f" 2>/dev/null
            perl -i -pe 's/\bcompileSdk\s*=?\s*\d+/compileSdk = 36/g' "$f" 2>/dev/null
            perl -i -pe 's/\bminSdkVersion\s*=?\s*\d+/minSdk = 21/g' "$f" 2>/dev/null
            perl -i -pe 's/\bminSdk\s*=?\s*\d+/minSdk = 21/g' "$f" 2>/dev/null
            perl -i -pe 's/\btargetSdkVersion\s*=?\s*\d+/targetSdk = 36/g' "$f" 2>/dev/null
            perl -i -pe 's/\btargetSdk\s*=?\s*\d+/targetSdk = 36/g' "$f" 2>/dev/null

            # jvmTarget — 4 varian
            perl -i -pe 's/jvmTarget\s*=\s*JavaVersion\.VERSION_\d+\.toString\(\)/jvmTarget = "17"/g' "$f" 2>/dev/null
            perl -i -pe 's/jvmTarget\s*=\s*JvmTarget\.JVM_\d+/jvmTarget = "17"/g' "$f" 2>/dev/null
            perl -i -pe 's/jvmTarget\s*=\s*"[^"]*"/jvmTarget = "17"/g' "$f" 2>/dev/null
            perl -i -pe "s/jvmTarget\s*=\s*'[^']*'/jvmTarget = \"17\"/g" "$f" 2>/dev/null

            # Java compatibility
            perl -i -pe 's/sourceCompatibility\s*=?\s*JavaVersion\.VERSION_\d+/sourceCompatibility = JavaVersion.VERSION_17/g' "$f" 2>/dev/null
            perl -i -pe 's/targetCompatibility\s*=?\s*JavaVersion\.VERSION_\d+/targetCompatibility = JavaVersion.VERSION_17/g' "$f" 2>/dev/null

            # Kotlin jvmToolchain
            perl -i -pe 's/jvmToolchain\(\s*\d+\s*\)/jvmToolchain(17)/g' "$f" 2>/dev/null

            # namespace + applicationId
            perl -i -pe 's/^(\s*)namespace\s+"([^"]+)"/\1namespace = "\2"/g' "$f" 2>/dev/null
            perl -i -pe "s/^(\s*)namespace\s+'([^']+)'/\1namespace = \"\2\"/g" "$f" 2>/dev/null
            perl -i -pe 's/^(\s*)applicationId\s+"([^"]+)"/\1applicationId = "\2"/g' "$f" 2>/dev/null
            perl -i -pe "s/^(\s*)applicationId\s+'([^']+)'/\1applicationId = \"\2\"/g" "$f" 2>/dev/null
          done

          echo "=== END DEEP FIX ==="
          echo ""

          # Show app/build.gradle
          if [ -f "app/build.gradle" ]; then
            echo "=== app/build.gradle ==="
            head -60 app/build.gradle
          elif [ -f "app/build.gradle.kts" ]; then
            echo "=== app/build.gradle.kts ==="
            head -60 app/build.gradle.kts
          fi

      - name: Fix Android Config (Flutter)
        if: needs.preflight.outputs.project_type == 'flutter'
        shell: bash
        run: |
          cd project
          if [ ! -d "android" ]; then echo "no android dir"; exit 0; fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n\n    <application|' "$MANIFEST" || true
          fi

          if [ -d "android/app/src/main/res" ]; then
            find android/app/src/main/res -name "ic_launcher*.png" -size 0 -delete 2>/dev/null || true
            NEEDS=false
            for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              PNG="android/app/src/main/res/$d/ic_launcher.png"
              if [ ! -f "$PNG" ]; then NEEDS=true; break; fi
              if ! file "$PNG" | grep -q PNG; then NEEDS=true; break; fi
            done
            if [ "$NEEDS" = "true" ]; then
              convert -size 512x512 xc:blue /tmp/icon.png 2>/dev/null || true
              if [ -f /tmp/icon.png ]; then
                for pair in "hdpi 72" "mdpi 48" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
                  set -- $pair
                  D="android/app/src/main/res/mipmap-$1"
                  mkdir -p "$D"
                  convert /tmp/icon.png -resize ${2}x${2} "$D/ic_launcher.png" 2>/dev/null || true
                  cp "$D/ic_launcher.png" "$D/ic_launcher_round.png" 2>/dev/null || true
                done
              fi
            fi
          fi

          printf '%s\n' 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m' 'org.gradle.parallel=true' 'org.gradle.caching=true' 'org.gradle.configureondemand=true' 'org.gradle.daemon=false' 'android.useAndroidX=true' 'android.enableJetifier=true' 'android.nonTransitiveRClass=false' 'android.nonFinalResIds=false' 'android.suppressUnsupportedCompileSdk=36' 'kotlin.daemon.jvmargs=-Xmx2048m' 'kotlin.jvm.target.validation.mode=ignore' 'kotlin.compiler.execution.strategy=in-process' > android/gradle.properties

          FLUTTER_ROOT_DIR=$(dirname "$(dirname "$(which flutter 2>/dev/null || echo /opt/flutter)")")
          printf '%s\n' "flutter.sdk=$FLUTTER_ROOT_DIR" "sdk.dir=$ANDROID_HOME" > android/local.properties

          if [ -f "../release.keystore" ]; then
            cp ../release.keystore android/app/ 2>/dev/null || true
          fi
        echo "Android config fixed"

      # ====================================================================
      # FIX GRADLE PROPERTIES (untuk non-flutter)
      # ====================================================================
      - name: Fix Gradle Properties
        shell: bash
        run: |
          cd project
          if [ "${{ needs.preflight.outputs.project_type }}" = "gradle" ]; then
            printf '%s\n' \
              'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m' \
              'org.gradle.parallel=true' \
              'org.gradle.caching=true' \
              'org.gradle.daemon=false' \
              'android.useAndroidX=true' \
              'android.enableJetifier=true' \
              'android.suppressUnsupportedCompileSdk=36' \
              'kotlin.daemon.jvmargs=-Xmx2048m' \
              'kotlin.jvm.target.validation.mode=ignore' \
              'kotlin.compiler.execution.strategy=in-process' \
              > gradle.properties
            echo "gradle.properties updated"
          fi

      # ====================================================================
      # BUILD LOOP — 5 attempts
      # ====================================================================
      - name: Build
        shell: bash
        run: |
          set +e
          cd project
          MODE="${{ needs.preflight.outputs.build_type }}"
          PTYPE="${{ needs.preflight.outputs.project_type }}"

          if [ "$PTYPE" = "gradle" ] && [ -f gradlew ]; then chmod +x gradlew; fi

          MAX=5
          SUCCESS=false
          AGP_LIST=("8.11.1" "8.9.1" "8.7.0" "8.3.0" "8.7.0")
          KT_LIST=("2.2.20" "2.1.0" "2.0.20" "1.9.0" "2.0.20")

          for N in $(seq 1 $MAX); do
            i=$((N-1))
            echo "===== ATTEMPT $N / $MAX ====="
            AGP="${AGP_LIST[$i]:-8.7.0}"
            KT="${KT_LIST[$i]:-2.0.20}"

            for f in android/settings.gradle android/settings.gradle.kts settings.gradle settings.gradle.kts; do
              [ -f "$f" ] || continue
              sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']com\.android\.application[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${AGP}\"|g" "$f" 2>/dev/null
              sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']com\.android\.library[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${AGP}\"|g" "$f" 2>/dev/null
              sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']org\.jetbrains\.kotlin\.android[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${KT}\"|g" "$f" 2>/dev/null
            done
            for f in android/build.gradle android/build.gradle.kts build.gradle build.gradle.kts; do
              [ -f "$f" ] || continue
              sed -i -E "s|com\.android\.tools\.build:gradle:[0-9.]+|com.android.tools.build:gradle:${AGP}|g" "$f" 2>/dev/null
              sed -i -E "s|org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]+|org.jetbrains.kotlin:kotlin-gradle-plugin:${KT}|g" "$f" 2>/dev/null
              sed -i -E "s|ext\.kotlin_version[[:space:]]*=[[:space:]]*[\"'][0-9.]+[\"']|ext.kotlin_version = '${KT}'|g" "$f" 2>/dev/null
            done

            MAJOR=$(echo "$AGP" | cut -d. -f1)
            MINOR=$(echo "$AGP" | cut -d. -f2)
            case "${MAJOR}.${MINOR}" in
              8.13) GR="8.14" ;;
              8.12|8.11) GR="8.13" ;;
              8.10|8.9) GR="8.11.1" ;;
              8.8) GR="8.10.2" ;;
              8.7) GR="8.9" ;;
              8.6|8.5) GR="8.7" ;;
              8.4) GR="8.6" ;;
              8.3) GR="8.4" ;;
              *) GR="8.13" ;;
            esac
            for d in android gradle .; do
              if [ -d "$d" ] && { [ -f "$d/gradlew" ] || [ -f "$d/gradle/wrapper/gradle-wrapper.properties" ]; }; then
                mkdir -p "$d/gradle/wrapper"
                printf '%s\n' 'distributionBase=GRADLE_USER_HOME' 'distributionPath=wrapper/dists' "distributionUrl=https://services.gradle.org/distributions/gradle-${GR}-all.zip" 'zipStoreBase=GRADLE_USER_HOME' 'zipStorePath=wrapper/dists' > "$d/gradle/wrapper/gradle-wrapper.properties"
                chmod +x "$d/gradlew" 2>/dev/null || true
              fi
            done

            echo "AGP=$AGP Kotlin=$KT Gradle=$GR"

            rm -rf build .dart_tool/package_config.json 2>/dev/null || true

            if [ "$PTYPE" = "flutter" ]; then
              flutter pub get 2>&1 | tail -3
              if [ "$MODE" = "release" ]; then
                flutter build apk --release --no-tree-shake-icons 2>&1 | tail -80
              else
                flutter build apk --debug 2>&1 | tail -80
              fi
              if [ -f "build/app/outputs/flutter-apk/app-${MODE}.apk" ] || [ -f "build/app/outputs/flutter-apk/app-release.apk" ] || [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
                echo "SUCCESS attempt $N"; SUCCESS=true; break
              fi
            else
              TASK="assembleRelease"
              [ "$MODE" = "debug" ] && TASK="assembleDebug"
              if [ -f gradlew ]; then
                ./gradlew "$TASK" --no-daemon --console=plain --stacktrace --warning-mode=none 2>&1 | tail -100
              else
                gradle "$TASK" --no-daemon --console=plain 2>&1 | tail -100 || gradle wrapper 2>&1 | tail -5
              fi
              APK=$(find . -name "*.apk" -path "*outputs/apk*" 2>/dev/null | head -n1)
              if [ -n "$APK" ]; then
                echo "SUCCESS attempt $N"
                mkdir -p /tmp/out
                cp "$APK" /tmp/out/app-release.apk
                SUCCESS=true; break
              fi
            fi

            echo "Attempt $N failed"
            flutter clean >/dev/null 2>&1 || true
            rm -rf build .dart_tool 2>/dev/null || true
            sleep 2
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "ALL FAILED"
            echo ""
            echo "=== LAST 30 ERROR LINES (dari build log terakhir) ==="
            ls -la 2>/dev/null
            for f in android/app/build.gradle.kts android/app/build.gradle build.gradle.kts build.gradle; do
              [ -f "$f" ] && { echo "=== $f ==="; head -50 "$f"; echo "=== END ==="; }
            done
            exit 1
          fi
          echo "Build OK"

      - name: Sign APK
        if: needs.preflight.outputs.build_type == 'release'
        shell: bash
        run: |
          if [ "${{ needs.preflight.outputs.project_type }}" = "flutter" ]; then
            APK=$(find project/build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -n1)
          else
            APK=$(find /tmp/out -name "*.apk" 2>/dev/null | head -n1)
          fi
          [ -z "$APK" ] && exit 0
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK" 2>/dev/null || true

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p output
          if [ "${{ needs.preflight.outputs.project_type }}" == "flutter" ]; then
            APK=$(find project/build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -n1)
          else
            APK=$(find /tmp/out -name "*.apk" 2>/dev/null | head -n1)
          fi
          [ -z "$APK" ] && { echo "No APK"; exit 1; }
          cp "$APK" output/app-release.apk
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
          retention-days: 1
          if-no-files-found: error