name: Build Flutter APK (Nuclear Auto-Fix)

on:
  push:
    branches:
      - build
    paths:
      - 'flutter-project.zip'
      - 'build-config.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m"
  JAVA_TOOL_OPTIONS: "-Xmx4096m"

jobs:
  preflight:
    name: 🔍 Preflight
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.cfg.outputs.build_type }}
      flutter_version: ${{ steps.detect.outputs.flutter_version }}
    steps:
      - uses: actions/checkout@v4

      - name: 📄 Read Build Config
        id: cfg
        run: |
          if [ -f build-config.json ]; then
            BT=$(jq -r .build_type build-config.json)
            echo "build_type=$BT" >> $GITHUB_OUTPUT
          else
            echo "build_type=release" >> $GITHUB_OUTPUT
          fi

      - name: 🎯 Detect Flutter Version
        id: detect
        run: |
          rm -rf /tmp/fc && mkdir -p /tmp/fc
          unzip -q flutter-project.zip -d /tmp/fc 2>/dev/null || true
          PUB=$(find /tmp/fc -maxdepth 3 -name pubspec.yaml | head -n1)
          if [ -z "$PUB" ]; then
            echo "flutter_version=3.35.2" >> $GITHUB_OUTPUT
            exit 0
          fi
          SDK_LINE=$(grep -A3 '^environment:' "$PUB" | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["'\'']//g' || true)
          DART_VER=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n1 || echo "")
          FV="3.35.2"
          case "$DART_VER" in
            "3.8"*) FV="3.32.0" ;;
            "3.7"*) FV="3.29.0" ;;
            "3.6"*) FV="3.27.0" ;;
            "3.5"*) FV="3.24.0" ;;
          esac
          echo "flutter_version=$FV" >> $GITHUB_OUTPUT
          echo "🎯 Flutter: $FV"

  build:
    name: 🔨 Build APK
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: 📱 Install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" \
                     "build-tools;34.0.0" "build-tools;35.0.0" "build-tools;36.0.0" \
                     "platform-tools" "cmdline-tools;latest" || true

      - name: 📚 Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick jq unzip curl file zip p7zip-full python3

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.sha }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 📄 Read Config
        run: |
          if [ -f build-config.json ]; then
            echo "type=$(jq -r .type build-config.json)" >> $GITHUB_ENV
            echo "build_type=$(jq -r .build_type build-config.json)" >> $GITHUB_ENV
          else
            echo "type=flutter" >> $GITHUB_ENV
            echo "build_type=release" >> $GITHUB_ENV
          fi

      - name: 🔐 Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      - name: 📦 Extract Project
        run: |
          rm -rf flutter-project && mkdir -p flutter-project
          rm -rf /tmp/ext && mkdir -p /tmp/ext
          unzip -q flutter-project.zip -d /tmp/ext || { echo "❌ Gagal extract ZIP"; exit 1; }
          PUB=$(find /tmp/ext -maxdepth 3 -name pubspec.yaml | head -n1)
          [ -z "$PUB" ] && { echo "❌ pubspec.yaml tidak ditemukan"; exit 1; }
          SRC_DIR=$(dirname "$PUB")
          cp -R "$SRC_DIR"/. flutter-project/
          echo "✅ Project ready: $(du -sh flutter-project)"

      - name: 🎯 Setup Flutter ${{ needs.preflight.outputs.flutter_version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.preflight.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: 📊 Flutter Version
        run: flutter --version

      # ====================================================================
      # 🧠 NUCLEAR AUTO-FIX + BUILD
      # ====================================================================
      - name: 🧠 Auto-Fix & Build
        id: autofix
        shell: bash
        run: |
          set +e
          cd flutter-project
          MODE="${build_type:-release}"
          log() { echo "[$(date +%H:%M:%S)] $*"; }

          # ==========================================================
          # 🐍 PYTHON FIXER — KTS syntax Groovy → Kotlin
          # ==========================================================
          fix_kts_python() {
            log "🐍 Fix KTS syntax pakai Python..."
            python3 <<'PYEOF'
import re
import os

def fix_kts_file(path):
    if not os.path.exists(path):
        return False
    with open(path, 'r', encoding='utf-8', errors='ignore') as f:
        content = f.read()
    original = content

    # compileSdk 36 → compileSdk = 36
    content = re.sub(r'(^|\s)compileSdkVersion\s*=?\s*(\d+)', r'compileSdk = 36', content)
    content = re.sub(r'(^|\s)compileSdk\s*=?\s*(\d+)', r'compileSdk = 36', content)

    # minSdk 21 → minSdk = 21
    content = re.sub(r'(^|\s)minSdkVersion\s*=?\s*(\d+)', r'minSdk = 21', content)
    content = re.sub(r'(^|\s)minSdk\s*=?\s*(\d+)', r'minSdk = 21', content)

    # targetSdk 36 → targetSdk = 36
    content = re.sub(r'(^|\s)targetSdkVersion\s*=?\s*(\d+)', r'targetSdk = 36', content)
    content = re.sub(r'(^|\s)targetSdk\s*=?\s*(\d+)', r'targetSdk = 36', content)

    # namespace "x" → namespace = "x"
    content = re.sub(r'^(\s*)namespace\s+"([^"]+)"', r'\1namespace = "\2"', content, flags=re.M)
    content = re.sub(r"^(\s*)namespace\s+'([^']+)'", r'\1namespace = "\2"', content, flags=re.M)

    # applicationId "x" → applicationId = "x"
    content = re.sub(r'^(\s*)applicationId\s+"([^"]+)"', r'\1applicationId = "\2"', content, flags=re.M)
    content = re.sub(r"^(\s*)applicationId\s+'([^']+)'", r'\1applicationId = "\2"', content, flags=re.M)

    # ndkVersion "x" → ndkVersion = "x"
    content = re.sub(r'^(\s*)ndkVersion\s+"([^"]+)"', r'\1ndkVersion = "\2"', content, flags=re.M)
    content = re.sub(r"^(\s*)ndkVersion\s+'([^']+)'", r'\1ndkVersion = "\2"', content, flags=re.M)

    # versionCode flutter.versionCode → versionCode = flutter.versionCode
    content = re.sub(r'^(\s*)versionCode\s+([^\s=\n]+)', r'\1versionCode = \2', content, flags=re.M)
    content = re.sub(r'^(\s*)versionName\s+([^\s=\n]+)', r'\1versionName = \2', content, flags=re.M)

    # signingConfig signingConfigs.X → signingConfig = signingConfigs.X
    content = re.sub(r'signingConfig\s+signingConfigs\.', 'signingConfig = signingConfigs.', content)

    # jvmTarget → "17"
    content = re.sub(r'jvmTarget\s*=\s*JavaVersion\.VERSION_\d+\.toString\(\)', 'jvmTarget = "17"', content)
    content = re.sub(r'jvmTarget\s*=\s*JvmTarget\.JVM_\d+', 'jvmTarget = "17"', content)
    content = re.sub(r'jvmTarget\s*=\s*"[^"]*"', 'jvmTarget = "17"', content)
    content = re.sub(r"jvmTarget\s*=\s*'[^']*'", 'jvmTarget = "17"', content)

    # sourceCompatibility / targetCompatibility
    content = re.sub(r'sourceCompatibility\s*=?\s*JavaVersion\.VERSION_\d+', 'sourceCompatibility = JavaVersion.VERSION_17', content)
    content = re.sub(r'targetCompatibility\s*=?\s*JavaVersion\.VERSION_\d+', 'targetCompatibility = JavaVersion.VERSION_17', content)

    if content != original:
        with open(path, 'w', encoding='utf-8') as f:
            f.write(content)
        print(f"  ✅ Fixed: {path}")
        return True
    else:
        print(f"  ⏭️  {path} (no change)")
        return False

# Fix all KTS files
for f in [
    'android/app/build.gradle.kts',
    'android/build.gradle.kts',
    'android/settings.gradle.kts',
]:
    fix_kts_file(f)

# Fix all Groovy files
def fix_groovy_file(path):
    if not os.path.exists(path):
        return False
    with open(path, 'r', encoding='utf-8', errors='ignore') as f:
        content = f.read()
    original = content

    content = re.sub(r'(^|\s)compileSdkVersion\s*=?\s*(\d+)', r'compileSdkVersion 36', content)
    content = re.sub(r'(^|\s)compileSdk\s*=?\s*(\d+)', r'compileSdk 36', content)
    content = re.sub(r'(^|\s)minSdkVersion\s*=?\s*(\d+)', r'minSdkVersion 21', content)
    content = re.sub(r'(^|\s)minSdk\s*=?\s*(\d+)', r'minSdk 21', content)
    content = re.sub(r'(^|\s)targetSdkVersion\s*=?\s*(\d+)', r'targetSdkVersion 36', content)
    content = re.sub(r'(^|\s)targetSdk\s*=?\s*(\d+)', r'targetSdk 36', content)
    content = re.sub(r'jvmTarget\s*=\s*"[^"]*"', 'jvmTarget = "17"', content)
    content = re.sub(r"jvmTarget\s*=\s*'[^']*'", 'jvmTarget = "17"', content)
    content = re.sub(r'sourceCompatibility\s*=?\s*JavaVersion\.VERSION_\d+', 'sourceCompatibility JavaVersion.VERSION_17', content)
    content = re.sub(r'targetCompatibility\s*=?\s*JavaVersion\.VERSION_\d+', 'targetCompatibility JavaVersion.VERSION_17', content)

    if content != original:
        with open(path, 'w', encoding='utf-8') as f:
            f.write(content)
        print(f"  ✅ Fixed: {path}")
        return True
    return False

for f in ['android/app/build.gradle', 'android/build.gradle', 'android/settings.gradle']:
    fix_groovy_file(f)

print("🐍 Python fix done")
PYEOF
          }

          # ==========================================================
          # 🔧 FIX PUBSPEC
          # ==========================================================
          fix_pubspec() {
            log "🔧 Fix pubspec..."
            sed -i -E "s|sdk:[[:space:]]*['\"]?[>=^~ ]*3\.[0-9.]+[^'\"]*['\"]?|sdk: '>=3.6.0 <4.0.0'|g" pubspec.yaml || true
            sed -i -E "s|webview_flutter:[[:space:]]*[^[:space:]]+|webview_flutter: ^4.13.0|g" pubspec.yaml || true
            sed -i -E "s|geolocator:[[:space:]]*[^[:space:]]+|geolocator: ^13.0.4|g" pubspec.yaml || true
            sed -i -E "s|firebase_core:[[:space:]]*[^[:space:]]+|firebase_core: ^2.32.0|g" pubspec.yaml || true
            sed -i -E "s|image_picker:[[:space:]]*[^[:space:]]+|image_picker: ^1.1.2|g" pubspec.yaml || true
            sed -i -E "s|file_picker:[[:space:]]*[^[:space:]]+|file_picker: ^6.2.1|g" pubspec.yaml || true
            sed -i -E "s|permission_handler:[[:space:]]*[^[:space:]]+|permission_handler: ^11.3.1|g" pubspec.yaml || true
            rm -f pubspec.lock
          }

          # ==========================================================
          # 🔥 REGENERATE ANDROID FOLDER (Nuclear Option)
          # ==========================================================
          regenerate_android() {
            log "🔥 REGENERATE android/ folder (nuclear)..."

            # Backup important customizations
            mkdir -p /tmp/android_backup
            [ -f android/app/src/main/AndroidManifest.xml ] && cp android/app/src/main/AndroidManifest.xml /tmp/android_backup/ 2>/dev/null
            [ -d android/app/src/main/res ] && cp -r android/app/src/main/res /tmp/android_backup/res 2>/dev/null
            [ -f android/app/src/main/kotlin ] && cp -r android/app/src/main/kotlin /tmp/android_backup/kotlin 2>/dev/null
            [ -f android/app/src/main/java ] && cp -r android/app/src/main/java /tmp/android_backup/java 2>/dev/null

            # Get project name from pubspec
            PROJECT_NAME=$(grep -E '^name:' pubspec.yaml | head -n1 | sed 's/name:[[:space:]]*//; s/[[:space:]]*$//' || echo "myapp")
            log "   Project: $PROJECT_NAME"

            # Remove old android folder
            rm -rf android

            # Regenerate via flutter create
            flutter create --platforms=android --project-name "$PROJECT_NAME" --org com.example . 2>&1 | tee /tmp/fc.log

            if [ ! -f "android/app/build.gradle.kts" ] && [ ! -f "android/app/build.gradle" ]; then
              log "❌ flutter create gagal regenerate!"
              tail -20 /tmp/fc.log
              return 1
            fi

            log "   ✅ Regenerated"

            # Restore AndroidManifest if exists
            if [ -f /tmp/android_backup/AndroidManifest.xml ]; then
              cp /tmp/android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null
              log "   ↩️  Restored AndroidManifest.xml"
            fi

            # Restore res folder (app icons)
            if [ -d /tmp/android_backup/res ]; then
              cp -r /tmp/android_backup/res/. android/app/src/main/res/ 2>/dev/null
              log "   ↩️  Restored res/"
            fi

            # Copy keystore
            cp ../release.keystore android/app/ 2>/dev/null || cp release.keystore android/app/ 2>/dev/null

            return 0
          }

          # ==========================================================
          # 🔧 FIX ANDROID CONFIG (after Python fix, apply keystore etc)
          # ==========================================================
          fix_android_config() {
            log "🔧 Fix android config (keystore, SDK, dll)..."
            cd android 2>/dev/null || return 0
            cp ../../release.keystore app/ 2>/dev/null || cp ../release.keystore app/ 2>/dev/null || true

            for f in app/build.gradle app/build.gradle.kts; do
              [ -f "$f" ] || continue
              # Keystore (support both syntax)
              perl -i -pe 's/storeFile\s*=?\s*file\(".*"\)/storeFile = file("release.keystore")/g' "$f"
              perl -i -pe "s/storeFile\s*=?\s*file\('.*'\)/storeFile = file(\"release.keystore\")/g" "$f"
              perl -i -pe 's/storeFile\s+file\(".*"\)/storeFile = file("release.keystore")/g' "$f"
              perl -i -pe 's/storePassword\s*=?\s*".*"/storePassword = "password"/g' "$f"
              perl -i -pe "s/storePassword\s*=?\s*'.*'/storePassword = \"password\"/g" "$f"
              perl -i -pe 's/keyAlias\s*=?\s*".*"/keyAlias = "release"/g' "$f"
              perl -i -pe "s/keyAlias\s*=?\s*'.*'/keyAlias = \"release\"/g" "$f"
              perl -i -pe 's/keyPassword\s*=?\s*".*"/keyPassword = "password"/g' "$f"
              perl -i -pe "s/keyPassword\s*=?\s*'.*'/keyPassword = \"password\"/g" "$f"
            done

            cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          org.gradle.daemon=false
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=false
          android.nonFinalResIds=false
          android.suppressUnsupportedCompileSdk=36
          kotlin.daemon.jvmargs=-Xmx2048m
          kotlin.jvm.target.validation.mode=warning
          EOF

            cd ..
          }

          # ==========================================================
          # 🔧 FIX AGP/KOTLIN VERSION
          # ==========================================================
          fix_gradle_agp() {
            local AGP="$1"; local KT="$2"
            for f in android/settings.gradle android/settings.gradle.kts; do
              [ -f "$f" ] || continue
              sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']com\.android\.application[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${AGP}\"|g" "$f" || true
              sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']com\.android\.library[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${AGP}\"|g" "$f" || true
              sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']org\.jetbrains\.kotlin\.android[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${KT}\"|g" "$f" || true
            done
            for f in android/build.gradle android/build.gradle.kts; do
              [ -f "$f" ] || continue
              sed -i -E "s|com\.android\.tools\.build:gradle:[0-9.]+|com.android.tools.build:gradle:${AGP}|g" "$f" || true
              sed -i -E "s|org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]+|org.jetbrains.kotlin:kotlin-gradle-plugin:${KT}|g" "$f" || true
              sed -i -E "s|ext\.kotlin_version[[:space:]]*=[[:space:]]*[\"'][0-9.]+[\"']|ext.kotlin_version = '${KT}'|g" "$f" || true
            done
          }

          fix_gradle_wrapper() {
            local AGP="$1"
            local MAJOR=$(echo "$AGP" | cut -d. -f1)
            local MINOR=$(echo "$AGP" | cut -d. -f2)
            local GRADLE_REQ
            case "${MAJOR}.${MINOR}" in
              8.13) GRADLE_REQ="8.14" ;;
              8.12|8.11) GRADLE_REQ="8.13" ;;
              8.10|8.9) GRADLE_REQ="8.11.1" ;;
              8.8) GRADLE_REQ="8.10.2" ;;
              8.7) GRADLE_REQ="8.9" ;;
              8.6|8.5) GRADLE_REQ="8.7" ;;
              8.4) GRADLE_REQ="8.6" ;;
              8.3) GRADLE_REQ="8.4" ;;
              *) GRADLE_REQ="8.13" ;;
            esac
            mkdir -p android/gradle/wrapper
            cat > android/gradle/wrapper/gradle-wrapper.properties <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https://services.gradle.org/distributions/gradle-${GRADLE_REQ}-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
            chmod +x android/gradlew 2>/dev/null || true
          }

          # ==========================================================
          # 🚀 MAIN LOOP — 4 attempts
          # ==========================================================
          MAX=4
          SUCCESS=false
          AGP_LIST=("8.11.1" "8.9.1" "8.7.0" "8.9.1")
          KT_LIST=("2.2.20" "2.1.0" "2.0.20" "2.1.0")

          for i in $(seq 0 $((MAX-1))); do
            N=$((i+1))
            log "═══════ ATTEMPT $N / $MAX ═══════"

            # === ATTEMPT 1-2: Python syntax fix ===
            # === ATTEMPT 3-4: Regenerate android folder ===
            if [ "$N" -ge 3 ]; then
              log "🔥 NUCLEAR: regenerate android folder (attempt $N)"
              regenerate_android || log "⚠️ regenerate gagal, lanjut"
            fi

            fix_pubspec

            log "📚 flutter pub get..."
            for j in 1 2 3; do
              flutter pub get 2>&1 | tail -3 && break
              sleep 2
            done

            # === PYTHON FIX (always run) ===
            fix_kts_python

            # === ANDROID CONFIG FIX ===
            fix_android_config

            AGP="${AGP_LIST[$i]:-8.7.0}"
            KT="${KT_LIST[$i]:-2.0.20}"
            fix_gradle_agp "$AGP" "$KT"
            fix_gradle_wrapper "$AGP"
            log "🎯 AGP=$AGP Kotlin=$KT"

            # Show fix result
            log "─── app/build.gradle.kts SETELAH FIX ───"
            if [ -f android/app/build.gradle.kts ]; then
              head -40 android/app/build.gradle.kts
            elif [ -f android/app/build.gradle ]; then
              head -40 android/app/build.gradle
            fi
            log "─────────────────────────────────────────"

            # ---------- BUILD ----------
            log "🔨 Build ($MODE) attempt $N..."
            rm -rf build .dart_tool/package_config.json 2>/dev/null || true

            if [ "$MODE" = "release" ]; then
              flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log
            else
              flutter build apk --debug 2>&1 | tee build.log
            fi

            if [ -f "build/app/outputs/flutter-apk/app-${MODE}.apk" ] || \
               [ -f "build/app/outputs/flutter-apk/app-release.apk" ] || \
               [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
              log "✅ BUILD SUCCESS attempt $N!"
              SUCCESS=true
              break
            fi

            log "❌ Attempt $N gagal."

            log "─────── Error context ───────"
            grep -E "^e: file|Line [0-9]+:|Unexpected|expected|Script compilation|What went wrong" build.log | head -20
            log "─────────────────────────────"

            flutter clean >/dev/null 2>&1 || true
            rm -rf build .dart_tool
            sleep 2
          done

          if [ "$SUCCESS" != "true" ]; then
            log "❌ SEMUA ATTEMPT GAGAL"
            echo ""
            echo "═══════════════════════════════════════════════════"
            echo "🐞 200 BARIS TERAKHIR"
            echo "═══════════════════════════════════════════════════"
            tail -200 build.log
            echo ""
            echo "═══════════════════════════════════════════════════"
            echo "🐞 FILE gradle SAAT ERROR"
            echo "═══════════════════════════════════════════════════"
            for f in android/app/build.gradle.kts android/app/build.gradle android/settings.gradle.kts android/settings.gradle; do
              [ -f "$f" ] && { echo ""; echo "════ $f ════"; cat -n "$f"; echo "════ END ════"; }
            done
            exit 1
          fi

          ls -la build/app/outputs/flutter-apk/ || true

      - name: 📎 Upload Diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic
          path: |
            flutter-project/build.log
            flutter-project/android/app/build.gradle.kts
            flutter-project/android/app/build.gradle
          retention-days: 7
          if-no-files-found: ignore

      - name: 🔏 Sign APK
        if: success() && env.build_type == 'release'
        run: |
          APK=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n1)
          [ -z "$APK" ] && exit 1
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK" || true

      - name: 📦 Collect APK
        if: success()
        run: |
          mkdir -p output
          APK=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n1)
          [ -z "$APK" ] && exit 1
          cp "$APK" output/app-release.apk

      - name: 📤 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
          retention-days: 1
          if-no-files-found: error

      - name: 📊 Summary
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "Build Type     : ${{ env.build_type }}"
          echo "Flutter Version: ${{ needs.preflight.outputs.flutter_version }}"
          echo "Status         : ${{ job.status }}"
          echo "════════════════════════════════════════"
