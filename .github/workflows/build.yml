name: Build APK (Mega Auto-Fix)

on:
  push:
    branches:
      - build
    paths:
      - 'zip-chunks/**'
      - 'zip-info.json'
      - 'build-config.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
  JAVA_TOOL_OPTIONS: "-Xmx4096m"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.cfg.outputs.build_type }}
      project_type: ${{ steps.cfg.outputs.project_type }}
      flutter_version: ${{ steps.detect.outputs.flutter_version }}
    steps:
      - uses: actions/checkout@v4

      - name: "Preflight - install detection utilities"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip jq p7zip-full python3 2>/dev/null || true

      - name: Read Config
        id: cfg
        run: |
          BT="release"
          PT="flutter"
          if [ -f build-config.json ]; then
            BT=$(jq -r .build_type build-config.json)
            PT=$(jq -r .type build-config.json)
          fi
          echo "build_type=$BT" >> $GITHUB_OUTPUT
          echo "project_type=$PT" >> $GITHUB_OUTPUT
          echo "Type: $PT | Mode: $BT"

      - name: Reassemble ZIP for Detection
        run: |
          rm -f /tmp/project.zip
          TOTAL=$(jq -r .totalChunks zip-info.json)
          echo "Reassembling $TOTAL chunks..."
          for (( i=0; i<TOTAL; i++ )); do
            PADDED=$(printf "%04d" $i)
            cat "zip-chunks/chunk-${PADDED}.bin" >> /tmp/project.zip
          done
          ls -la /tmp/project.zip

      - name: Detect Flutter Version
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fc && mkdir -p /tmp/fc
          7z x /tmp/project.zip -o/tmp/fc -y -bso0 -bsp0 >/dev/null 2>&1 || unzip -oq /tmp/project.zip -d /tmp/fc
          # Prefer the shallowest pubspec so a nested example/plugin cannot override the app.
          PUB=$(find /tmp/fc -maxdepth 6 -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -printf '%d %p\n' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "${PUB:-}" ]; then
            echo "flutter_version=3.35.2" >> "$GITHUB_OUTPUT"
            echo "No pubspec found; using current stable fallback 3.35.2"
            exit 0
          fi
          echo "Detected pubspec: $PUB"
          python3 - "$PUB" <<'PYDETECT' >> "$GITHUB_OUTPUT"
          import re, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          m = re.search(r'(?ms)^environment\s*:\s*\n(?:(?:[ \t]+.*)\n)*?[ \t]+sdk\s*:\s*[\"\']?([^\n#]+)', text)
          constraint = m.group(1).strip().strip('\"\'') if m else ''
          # Select the oldest stable Flutter release known to include the requested Dart SDK.
          versions = [(3,4,'3.22.0'), (3,5,'3.24.0'), (3,6,'3.27.0'),
                      (3,7,'3.29.0'), (3,8,'3.32.0'), (3,9,'3.35.2')]
          nums = re.findall(r'(?<![0-9])(3)\.(\d+)', constraint)
          lower = (3, 0)
          if nums:
              # >= and caret constraints use the first version as the minimum.
              lower = (int(nums[0][0]), int(nums[0][1]))
          chosen = next((v for major, minor, v in versions if (major, minor) >= lower), 'stable' if lower > (3, 9) else '3.35.2')
          print(f'flutter_version={chosen}')
          print(f'dart_constraint={constraint or "unspecified"}')
          PYDETECT
          echo "Flutter selected from Dart constraint: $(grep '^flutter_version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"

  build:
    name: Build APK
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: "[1/8] Install Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "[2/8] Install Android SDK dan Build Tools"
        shell: bash
        run: |
          set -Eeuo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan di $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Menggunakan SDK Manager: $SDKMANAGER"
          "$SDKMANAGER" --version

          # Terima lisensi secara non-interaktif. Hindari paket preview/emulator
          # yang tidak diperlukan untuk proses build APK.
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true

          # Pasang paket satu per satu agar kegagalan paket terlihat jelas.
          install_sdk_package() {
            local package="$1"
            local attempt=1
            until "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "$package"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::Gagal memasang Android SDK package: $package"
                return 1
              fi
              echo "Retry instalasi $package (percobaan $((attempt + 1))/3)"
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          install_sdk_package "platform-tools"
          install_sdk_package "platforms;android-36"
          install_sdk_package "build-tools;36.0.0"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Android SDK siap digunakan."

      - name: "[3/8] Install build utilities (ZIP, ImageMagick, jq)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick jq unzip curl file zip p7zip-full python3

      - name: "[4/8] Restore Gradle cache"
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.sha }}
          restore-keys: gradle-${{ runner.os }}-

      - name: "[5/8] Generate signing keystore"
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      - name: "[6/8] Reassemble ZIP dan extract source project"
        shell: bash
        run: |
          rm -f /tmp/project.zip /tmp/ext
          rm -rf project /tmp/ext
          mkdir -p project /tmp/ext

          echo "=== Reassembling chunks ==="
          TOTAL=$(jq -r .totalChunks zip-info.json)
          echo "Total chunks: $TOTAL"
          for (( i=0; i<TOTAL; i++ )); do
            PADDED=$(printf "%04d" $i)
            cat "zip-chunks/chunk-${PADDED}.bin" >> /tmp/project.zip
          done
          echo "ZIP size: $(du -h /tmp/project.zip)"

          echo "=== Extract pakai 7z (primary) ==="
          if 7z x /tmp/project.zip -o/tmp/ext -y -bso0 -bsp0 2>&1; then
            echo "OK 7z"
          elif bsdtar -xf /tmp/project.zip -C /tmp/ext 2>&1; then
            echo "OK bsdtar"
          elif python3 -c "import zipfile; zipfile.ZipFile('/tmp/project.zip').extractall('/tmp/ext')" 2>&1; then
            echo "OK python"
          else
            unzip -o -q /tmp/project.zip -d /tmp/ext 2>&1 || true
          fi

          if [ "${{ needs.preflight.outputs.project_type }}" = "flutter" ]; then
            PUB=$(find /tmp/ext -maxdepth 6 -type f -name pubspec.yaml -not -path '*/.*' -printf '%d %p\n' | sort -n | head -n1 | cut -d' ' -f2-)
            if [ -z "$PUB" ]; then echo "pubspec.yaml tidak ditemukan"; ls -la /tmp/ext; exit 1; fi
            SRC=$(dirname "$PUB")
            cp -R "$SRC"/. project/ 2>/dev/null || rsync -a "$SRC"/ project/ 2>/dev/null || true
            echo "Flutter project ready"
          else
            GL=$(find /tmp/ext -maxdepth 4 -name gradlew -type f | head -n1)
            if [ -z "$GL" ]; then
              GL=$(find /tmp/ext -maxdepth 4 \( -name build.gradle -o -name build.gradle.kts \) | head -n1)
              [ -z "$GL" ] && { echo "build.gradle tidak ditemukan"; exit 1; }
              GL=$(dirname "$GL")
            else
              GL=$(dirname "$GL")
            fi
            cp -R "$GL"/. project/ 2>/dev/null || rsync -a "$GL"/ project/ 2>/dev/null || true
            echo "Gradle project ready"
          fi

          echo "Project size: $(du -sh project 2>/dev/null)"
          ls project/ | head -20

      - name: "[7/8] Install Flutter ${{ needs.preflight.outputs.flutter_version }}"
        if: needs.preflight.outputs.project_type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.preflight.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Show and verify Flutter/Dart Version
        if: needs.preflight.outputs.project_type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          REQUIRED=$(python3 - <<'PYSDK'
          import re
          text = open('project/pubspec.yaml', encoding='utf-8').read()
          match = re.search(r'(?ms)^environment\s*:\s*\n(?:(?:[ \t]+.*)\n)*?[ \t]+sdk\s*:\s*["\']?([^\n#]+)', text)
          print(match.group(1).strip().strip('"\'') if match else '')
          PYSDK
          )
          echo "Project Dart SDK constraint: ${REQUIRED:-not declared}"
          DART_VERSION=$(dart --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -n "$REQUIRED" ] && [[ "$REQUIRED" =~ \>=[[:space:]]*([0-9]+\.[0-9]+) ]]; then
            MIN="${BASH_REMATCH[1]}"
            DART_MINOR=$(echo "$DART_VERSION" | cut -d. -f2)
            MIN_MINOR=$(echo "$MIN" | cut -d. -f2)
            if [ "$DART_MINOR" -lt "$MIN_MINOR" ]; then
              echo "ERROR: Dart $DART_VERSION is below required $MIN"
              exit 1
            fi
          fi

      - name: Fix Syntax KTS
        shell: bash
        run: |
          cd project
          find . -type f -name "*.gradle.kts" 2>/dev/null | while read f; do
            perl -i -pe "s/\bcompileSdkVersion\s*=?\s*\d+/compileSdk = 36/g" "$f" 2>/dev/null
            perl -i -pe "s/\bcompileSdk\s*=?\s*\d+/compileSdk = 36/g" "$f" 2>/dev/null
            perl -i -pe "s/\bminSdkVersion\s*=?\s*\d+/minSdk = 21/g" "$f" 2>/dev/null
            perl -i -pe "s/\bminSdk\s*=?\s*\d+/minSdk = 21/g" "$f" 2>/dev/null
            perl -i -pe "s/\btargetSdkVersion\s*=?\s*\d+/targetSdk = 36/g" "$f" 2>/dev/null
            perl -i -pe "s/\btargetSdk\s*=?\s*\d+/targetSdk = 36/g" "$f" 2>/dev/null
            perl -i -pe "s/^(\s*)namespace\s+\"([^\"]+)\"/\1namespace = \"\2\"/g" "$f" 2>/dev/null
            perl -i -pe "s/^(\s*)namespace\s+'([^']+)'/\1namespace = \"\2\"/g" "$f" 2>/dev/null
            perl -i -pe "s/^(\s*)applicationId\s+\"([^\"]+)\"/\1applicationId = \"\2\"/g" "$f" 2>/dev/null
            perl -i -pe "s/^(\s*)applicationId\s+'([^']+)'/\1applicationId = \"\2\"/g" "$f" 2>/dev/null
            perl -i -pe "s/^(\s*)ndkVersion\s+\"([^\"]+)\"/\1ndkVersion = \"\2\"/g" "$f" 2>/dev/null
            perl -i -pe "s/^(\s*)versionCode\s+([^\s=\n]+)/\1versionCode = \2/g" "$f" 2>/dev/null
            perl -i -pe "s/^(\s*)versionName\s+([^\s=\n]+)/\1versionName = \2/g" "$f" 2>/dev/null
            perl -i -pe "s/signingConfig\s+signingConfigs\./signingConfig = signingConfigs./g" "$f" 2>/dev/null
            perl -i -pe "s/jvmTarget\s*=\s*JavaVersion\.VERSION_[0-9]+(_[0-9]+)?\.toString\(\)/jvmTarget = \"17\"/g" "$f" 2>/dev/null
            perl -i -pe "s/jvmTarget\s*=\s*JvmTarget\.JVM_\d+/jvmTarget = \"17\"/g" "$f" 2>/dev/null
            perl -i -pe "s/jvmTarget\s*=\s*\"[^\"]*\"/jvmTarget = \"17\"/g" "$f" 2>/dev/null
            perl -i -pe "s/jvmTarget\s*=\s*'[^']*'/jvmTarget = \"17\"/g" "$f" 2>/dev/null
            perl -i -pe "s/sourceCompatibility\s*=?\s*JavaVersion\.VERSION_[0-9]+(_[0-9]+)?/sourceCompatibility = JavaVersion.VERSION_17/g" "$f" 2>/dev/null
            perl -i -pe "s/targetCompatibility\s*=?\s*JavaVersion\.VERSION_[0-9]+(_[0-9]+)?/targetCompatibility = JavaVersion.VERSION_17/g" "$f" 2>/dev/null
            perl -i -pe "s/JavaVersion\.VERSION_[0-9]+(_[0-9]+)?/JavaVersion.VERSION_17/g" "$f" 2>/dev/null
          done
          echo "KTS done"

      - name: Fix Syntax Groovy
        shell: bash
        run: |
          cd project
          find . -type f -name "*.gradle" 2>/dev/null | while read f; do
            perl -i -pe "s/\bcompileSdkVersion\s*=?\s*\d+/compileSdkVersion 36/g" "$f" 2>/dev/null
            perl -i -pe "s/\bcompileSdk\s*=?\s*\d+/compileSdk 36/g" "$f" 2>/dev/null
            perl -i -pe "s/\bminSdkVersion\s*=?\s*\d+/minSdkVersion 21/g" "$f" 2>/dev/null
            perl -i -pe "s/\bminSdk\s*=?\s*\d+/minSdk 21/g" "$f" 2>/dev/null
            perl -i -pe "s/\btargetSdkVersion\s*=?\s*\d+/targetSdkVersion 36/g" "$f" 2>/dev/null
            perl -i -pe "s/\btargetSdk\s*=?\s*\d+/targetSdk 36/g" "$f" 2>/dev/null
            perl -i -pe "s/jvmTarget\s*=\s*\"[^\"]*\"/jvmTarget = \"17\"/g" "$f" 2>/dev/null
            perl -i -pe "s/jvmTarget\s*=\s*'[^']*'/jvmTarget = \"17\"/g" "$f" 2>/dev/null
            perl -i -pe "s/sourceCompatibility\s*=?\s*JavaVersion\.VERSION_[0-9]+(_[0-9]+)?/sourceCompatibility JavaVersion.VERSION_17/g" "$f" 2>/dev/null
            perl -i -pe "s/targetCompatibility\s*=?\s*JavaVersion\.VERSION_[0-9]+(_[0-9]+)?/targetCompatibility JavaVersion.VERSION_17/g" "$f" 2>/dev/null
            perl -i -pe "s/JavaVersion\.VERSION_[0-9]+(_[0-9]+)?/JavaVersion.VERSION_17/g" "$f" 2>/dev/null
          done
          echo "Groovy done"

      - name: Validate Pubspec (non-destructive)
        if: needs.preflight.outputs.project_type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          cd project
          test -f pubspec.yaml || { echo "pubspec.yaml tidak ditemukan di root project"; exit 1; }
          # Normalize line endings only. Keep the project's SDK constraint and dependency versions intact.
          sed -i 's/\r$//' pubspec.yaml
          echo "Pubspec ditemukan; dependency dan SDK constraint dipertahankan."

      - name: Flutter Auto Fix
        if: needs.preflight.outputs.project_type == 'flutter'
        shell: bash
        run: |
          set -uo pipefail
          cd project
          flutter pub get 2>&1 | tee /tmp/flutter-pub-get-prefx.log | tail -60 || true
          echo "=== Dart formatter ==="
          dart format --output=write lib test 2>&1 || dart format --output=write lib 2>&1 || true
          echo "=== Apply supported Dart quick fixes ==="
          dart fix --apply 2>&1 || true
          echo "=== Flutter diagnostics ==="
          flutter analyze --no-pub 2>&1 | tee /tmp/flutter-analyze.log || true

      - name: Repair Flutter Gradle DSL
        if: needs.preflight.outputs.project_type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYGRADLE'
          from pathlib import Path
          import re

          roots = [Path('project'), Path.home() / '.pub-cache']
          changed = []

          def blocks_with_context(text):
              """Find flutter { ... } blocks nested inside android { ... } blocks."""
              stack = []
              found = []
              i = 0
              quote = None
              triple = False
              line_comment = False
              block_comment = False
              while i < len(text):
                  ch = text[i]
                  nxt = text[i:i+2]
                  if line_comment:
                      if ch == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if nxt == '*/': block_comment = False; i += 2
                      else: i += 1
                      continue
                  if quote:
                      if triple:
                          marker = quote * 3
                          if text.startswith(marker, i): quote = None; triple = False; i += 3
                          else: i += 1
                      else:
                          if ch == '\\': i += 2
                          elif ch == quote: quote = None; i += 1
                          else: i += 1
                      continue
                  if nxt == '//': line_comment = True; i += 2; continue
                  if nxt == '/*': block_comment = True; i += 2; continue
                  if ch in ('"', "'"):
                      if text.startswith(ch*3, i): quote = ch; triple = True; i += 3
                      else: quote = ch; i += 1
                      continue
                  if ch == '{':
                      prefix = text[max(0, i-100):i]
                      m = re.search(r'([A-Za-z_][A-Za-z0-9_]*)\s*(?:\([^{}]*\)\s*)?$', prefix)
                      name = m.group(1) if m else ''
                      if name == 'flutter' and any(x[0] == 'android' for x in stack):
                          found.append((i, tuple(x[0] for x in stack)))
                      stack.append((name, i))
                  elif ch == '}' and stack:
                      stack.pop()
                  i += 1
              # Resolve matching closing braces for each flutter block.
              result = []
              for start, parents in found:
                  depth = 1; j = start + 1; q = None; tri = False; lc = False; bc = False
                  while j < len(text) and depth:
                      c = text[j]; two = text[j:j+2]
                      if lc:
                          if c == '\n': lc = False
                          j += 1; continue
                      if bc:
                          if two == '*/': bc = False; j += 2
                          else: j += 1
                          continue
                      if q:
                          if tri:
                              if text.startswith(q*3, j): q = None; tri = False; j += 3
                              else: j += 1
                          else:
                              if c == '\\': j += 2
                              elif c == q: q = None; j += 1
                              else: j += 1
                          continue
                      if two == '//': lc = True; j += 2; continue
                      if two == '/*': bc = True; j += 2; continue
                      if c in ('"', "'"):
                          if text.startswith(c*3, j): q = c; tri = True; j += 3
                          else: q = c; j += 1
                          continue
                      if c == '{': depth += 1
                      elif c == '}': depth -= 1
                      j += 1
                  if depth == 0:
                      result.append((start, j, parents))
              return result

          for root in roots:
              if not root.exists():
                  continue
              for f in root.rglob('*'):
                  if not f.is_file() or f.suffix not in ('.gradle', '.kts'):
                      continue
                  try:
                      original = f.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  blocks = blocks_with_context(original)
                  if not blocks:
                      continue
                  is_app = f.name in ('build.gradle', 'build.gradle.kts') and f.parent.name == 'app' and f.parent.parent.name == 'android'
                  text = original
                  move = []
                  for start, end, parents in reversed(blocks):
                      block = text[start:end]
                      if is_app:
                          move.append(block.strip())
                      text = text[:start] + text[end:]
                  if move:
                      text = text.rstrip() + '\n\n' + '\n\n'.join(reversed(move)) + '\n'
                  if text != original:
                      f.write_text(text, encoding='utf-8')
                      changed.append(str(f))

          print('Flutter Gradle DSL repair complete.')
          if changed:
              print('Updated files:')
              for name in changed:
                  print(' - ' + name)
          else:
              print('No nested flutter {} blocks found; source left unchanged.')
          PYGRADLE

      - name: Fix Android Config
        shell: bash
        run: |
          cd project
          if [ ! -d "android" ]; then echo "no android dir"; exit 0; fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n\n    <application|' "$MANIFEST" || true
          fi

          if [ -d "android/app/src/main/res" ]; then
            find android/app/src/main/res -name "ic_launcher*.png" -size 0 -delete 2>/dev/null || true
            NEEDS=false
            for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              PNG="android/app/src/main/res/$d/ic_launcher.png"
              if [ ! -f "$PNG" ]; then NEEDS=true; break; fi
              if ! file "$PNG" | grep -q PNG; then NEEDS=true; break; fi
            done
            if [ "$NEEDS" = "true" ]; then
              convert -size 512x512 xc:blue /tmp/icon.png 2>/dev/null || true
              if [ -f /tmp/icon.png ]; then
                for pair in "hdpi 72" "mdpi 48" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
                  set -- $pair
                  D="android/app/src/main/res/mipmap-$1"
                  mkdir -p "$D"
                  convert /tmp/icon.png -resize ${2}x${2} "$D/ic_launcher.png" 2>/dev/null || true
                  cp "$D/ic_launcher.png" "$D/ic_launcher_round.png" 2>/dev/null || true
                done
              fi
            fi
          fi

          printf '%s\n' 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m' 'org.gradle.parallel=true' 'org.gradle.caching=true' 'org.gradle.configureondemand=true' 'org.gradle.daemon=false' 'android.useAndroidX=true' 'android.enableJetifier=true' 'android.nonTransitiveRClass=false' 'android.nonFinalResIds=false' 'android.suppressUnsupportedCompileSdk=36' 'kotlin.daemon.jvmargs=-Xmx2048m' 'kotlin.jvm.target.validation.mode=warning' > android/gradle.properties

          FLUTTER_ROOT_DIR=$(dirname "$(dirname "$(which flutter 2>/dev/null || echo /opt/flutter)")")
          printf '%s\n' "flutter.sdk=$FLUTTER_ROOT_DIR" "sdk.dir=$ANDROID_HOME" > android/local.properties

          if [ -f "../release.keystore" ]; then
            cp ../release.keystore android/app/ 2>/dev/null || true
          fi

          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            perl -i -pe 's/storeFile\s*=?\s*file\(".*"\)/storeFile = file("release.keystore")/g' "$f" 2>/dev/null
            perl -i -pe 's/storePassword\s*=?\s*".*"/storePassword = "password"/g' "$f" 2>/dev/null
            perl -i -pe 's/keyAlias\s*=?\s*".*"/keyAlias = "release"/g' "$f" 2>/dev/null
            perl -i -pe 's/keyPassword\s*=?\s*".*"/keyPassword = "password"/g' "$f" 2>/dev/null
          done
          echo "Android config fixed"

      - name: "[8/8] Resolve dependencies dan compile APK"
        shell: bash
        run: |
          set -uo pipefail
          cd project
          MODE="${{ needs.preflight.outputs.build_type }}"
          PTYPE="${{ needs.preflight.outputs.project_type }}"

          if [ "$PTYPE" = "gradle" ] && [ -f gradlew ]; then chmod +x gradlew; fi

          MAX=4
          SUCCESS=false
          AGP_LIST=("8.11.1" "8.9.1" "8.7.0" "8.3.0")
          KT_LIST=("2.2.20" "2.1.0" "2.0.20" "1.9.0")

          echo "::notice title=Build::Memulai proses build APK"
          for N in $(seq 1 $MAX); do
            i=$((N-1))
            echo "::group::Percobaan build $N/$MAX"
            echo "===== ATTEMPT $N / $MAX ====="
            echo "[1/5] Menyiapkan konfigurasi Android Gradle Plugin dan Kotlin"
            AGP="${AGP_LIST[$i]:-8.7.0}"
            KT="${KT_LIST[$i]:-2.0.20}"

            for f in android/settings.gradle android/settings.gradle.kts settings.gradle settings.gradle.kts; do
              [ -f "$f" ] || continue
              sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']com\.android\.application[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${AGP}\"|g" "$f" 2>/dev/null
              sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']com\.android\.library[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${AGP}\"|g" "$f" 2>/dev/null
              sed -i -E "s|(id[[:space:]]*\(?[[:space:]]*[\"']org\.jetbrains\.kotlin\.android[\"'][[:space:]]*\)?[[:space:]]+version[[:space:]]+)[\"'][0-9.]+[\"']|\1\"${KT}\"|g" "$f" 2>/dev/null
            done
            for f in android/build.gradle android/build.gradle.kts build.gradle build.gradle.kts; do
              [ -f "$f" ] || continue
              sed -i -E "s|com\.android\.tools\.build:gradle:[0-9.]+|com.android.tools.build:gradle:${AGP}|g" "$f" 2>/dev/null
              sed -i -E "s|org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]+|org.jetbrains.kotlin:kotlin-gradle-plugin:${KT}|g" "$f" 2>/dev/null
              sed -i -E "s|ext\.kotlin_version[[:space:]]*=[[:space:]]*[\"'][0-9.]+[\"']|ext.kotlin_version = '${KT}'|g" "$f" 2>/dev/null
            done

            MAJOR=$(echo "$AGP" | cut -d. -f1)
            MINOR=$(echo "$AGP" | cut -d. -f2)
            case "${MAJOR}.${MINOR}" in
              8.13) GR="8.14" ;;
              8.12|8.11) GR="8.13" ;;
              8.10|8.9) GR="8.11.1" ;;
              8.8) GR="8.10.2" ;;
              8.7) GR="8.9" ;;
              8.6|8.5) GR="8.7" ;;
              8.4) GR="8.6" ;;
              8.3) GR="8.4" ;;
              *) GR="8.13" ;;
            esac
            for d in android gradle .; do
              if [ -d "$d" ] && { [ -f "$d/gradlew" ] || [ -f "$d/gradle/wrapper/gradle-wrapper.properties" ]; }; then
                mkdir -p "$d/gradle/wrapper"
                printf '%s\n' 'distributionBase=GRADLE_USER_HOME' 'distributionPath=wrapper/dists' "distributionUrl=https://services.gradle.org/distributions/gradle-${GR}-all.zip" 'zipStoreBase=GRADLE_USER_HOME' 'zipStorePath=wrapper/dists' > "$d/gradle/wrapper/gradle-wrapper.properties"
                chmod +x "$d/gradlew" 2>/dev/null || true
              fi
            done

            echo "AGP=$AGP Kotlin=$KT Gradle=$GR"
            echo "[2/5] Membersihkan cache build sementara"
            rm -rf build .dart_tool/package_config.json 2>/dev/null || true

            if [ "$PTYPE" = "flutter" ]; then
              rm -rf build/app/outputs/flutter-apk
              echo "[3/5] Mengunduh dan memasang dependency Flutter (flutter pub get)"
              if ! flutter pub get 2>&1 | tee "/tmp/pub-get-${N}.log" | tail -40; then
                echo "pub get failed on attempt $N"
              elif [ "$MODE" = "release" ]; then
                echo "[4/5] Compile APK mode RELEASE"
                if flutter build apk --release --no-tree-shake-icons 2>&1 | tee "/tmp/flutter-build-${N}.log" | tail -120; then
                  [ -f "build/app/outputs/flutter-apk/app-release.apk" ] && { echo "SUCCESS attempt $N"; SUCCESS=true; break; }
                fi
                if grep -Eqi "Could not get unknown property 'flutter'.*LibraryExtension|unknown property 'flutter'.*LibraryExtension" "/tmp/flutter-build-${N}.log"; then
                  echo "::error title=Flutter Gradle DSL::Masih ada flutter {} block di dalam android {} pada modul Android Library. Lihat daftar file hasil Repair Flutter Gradle DSL."
                  echo "=== Gradle files containing flutter DSL ==="
                  grep -RIn --include='*.gradle' --include='*.gradle.kts' 'flutter[[:space:]]*{' . "$HOME/.pub-cache" 2>/dev/null | head -80 || true
                  break
                fi
              else
                echo "[4/5] Compile APK mode DEBUG"
                if flutter build apk --debug 2>&1 | tee "/tmp/flutter-build-${N}.log" | tail -120; then
                  [ -f "build/app/outputs/flutter-apk/app-debug.apk" ] && { echo "SUCCESS attempt $N"; SUCCESS=true; break; }
                fi
                if grep -Eqi "Could not get unknown property 'flutter'.*LibraryExtension|unknown property 'flutter'.*LibraryExtension" "/tmp/flutter-build-${N}.log"; then
                  echo "::error title=Flutter Gradle DSL::Masih ada flutter {} block di dalam android {} pada modul Android Library. Lihat daftar file hasil Repair Flutter Gradle DSL."
                  echo "=== Gradle files containing flutter DSL ==="
                  grep -RIn --include='*.gradle' --include='*.gradle.kts' 'flutter[[:space:]]*{' . "$HOME/.pub-cache" 2>/dev/null | head -80 || true
                  break
                fi
              fi
            else
              echo "[3/5] Menyiapkan Gradle project dan dependency"
              TASK="assembleRelease"
              [ "$MODE" = "debug" ] && TASK="assembleDebug"
              echo "[4/5] Menjalankan Gradle task: $TASK"
              if [ -f gradlew ]; then
                ./gradlew "$TASK" --no-daemon --console=plain --stacktrace 2>&1 | tail -80
              else
                gradle "$TASK" --no-daemon --console=plain 2>&1 | tail -80 || gradle wrapper 2>&1 | tail -5
              fi
              APK=$(find . -name "*.apk" -path "*outputs/apk*" 2>/dev/null | head -n1)
              if [ -n "$APK" ]; then
                echo "SUCCESS attempt $N"
                mkdir -p /tmp/out
                cp "$APK" /tmp/out/app-release.apk
                SUCCESS=true; break
              fi
            fi

            echo "::endgroup::"
            echo "::warning title=Build retry::Percobaan $N gagal; menyiapkan percobaan berikutnya"
            echo "Attempt $N failed"
            flutter clean >/dev/null 2>&1 || true
            rm -rf build .dart_tool 2>/dev/null || true
            sleep 2
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "ALL FAILED"
            for f in android/app/build.gradle.kts android/app/build.gradle build.gradle.kts build.gradle; do
              [ -f "$f" ] && { echo "=== $f ==="; head -50 "$f"; echo "=== END ==="; }
            done
            exit 1
          fi
          echo "::notice title=Build selesai::APK berhasil dibuat"
          echo "Build OK"

      - name: "[9/10] Sign APK release"
        if: needs.preflight.outputs.build_type == 'release'
        shell: bash
        run: |
          if [ "${{ needs.preflight.outputs.project_type }}" = "flutter" ]; then
            APK=$(find project/build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -n1)
          else
            APK=$(find /tmp/out -name "*.apk" 2>/dev/null | head -n1)
          fi
          [ -z "$APK" ] && exit 0
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK" 2>/dev/null || true

      - name: "[10/10] Collect APK hasil build"
        shell: bash
        run: |
          mkdir -p output
          if [ "${{ needs.preflight.outputs.project_type }}" = "flutter" ]; then
            APK=$(find project/build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -n1)
          else
            APK=$(find /tmp/out -name "*.apk" 2>/dev/null | head -n1)
          fi
          [ -z "$APK" ] && { echo "No APK"; exit 1; }
          cp "$APK" output/app-release.apk
          ls -la output/

      - name: "Upload APK artifact"
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
          retention-days: 1
          if-no-files-found: error
